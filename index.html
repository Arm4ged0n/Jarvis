<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis // Official MCU Neural HUD</title>
    <style>
        :root {
            --bg-base: #020408;
            --panel-bg: rgba(0, 15, 30, 0.85);
            --border-color: rgba(0, 243, 255, 0.4);
            --primary: #00f3ff;
            --accent: #ffb700;
            --primary-glow: rgba(0, 243, 255, 0.5);
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --danger: #ff3d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        html, body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #020408; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.4); border-radius: 2px; }

        /* CANVAS MATRIX & TEIAS NEURAIS (BIOLOGICAL WEBS + MATRIX RAIN) */
        #matrixCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.95;
        }

        /* BOOT SCREEN COM HUD OFICIAL JARVIS / ARC REACTOR & MATRIX */
        #bootScreen {
            position: fixed;
            inset: 0;
            background: #020408;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 30px;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #bootScreen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .mcu-hud-loader {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 90px rgba(0, 243, 255, 0.2), inset 0 0 45px rgba(255, 183, 0, 0.15);
        }

        .hud-ring-gold {
            position: absolute;
            inset: 0;
            border: 2px dashed var(--accent);
            border-radius: 50%;
            animation: spinClockwise 14s linear infinite;
        }

        .hud-ring-blue {
            position: absolute;
            inset: 16px;
            border: 2px solid var(--primary);
            border-top: 2px solid transparent;
            border-bottom: 2px solid transparent;
            border-radius: 50%;
            animation: spinCounter 8s linear infinite;
        }

        .hud-ring-dots {
            position: absolute;
            inset: 36px;
            border: 1px dotted rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: spinClockwise 6s linear infinite;
        }

        .hud-core-reactor {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, var(--primary) 50%, rgba(0,243,255,0.2) 80%, transparent 100%);
            box-shadow: 0 0 60px var(--accent), inset 0 0 20px #ffffff;
            animation: corePulse 1.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        @keyframes spinClockwise { to { transform: rotate(360deg); } }
        @keyframes spinCounter { to { transform: rotate(-360deg); } }
        @keyframes corePulse { 0%, 100% { transform: scale(0.92); opacity: 0.8; } 50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 90px var(--accent); } }

        .boot-status {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 49%, 100% { opacity: 1; } 50%, 99% { opacity: 0.3; } }

        /* ACTIVATION SCREEN */
        #activationScreen {
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 8, 0.97);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in;
        }

        #activationScreen.show {
            opacity: 1;
            pointer-events: all;
        }

        .activation-btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--accent);
            background: rgba(255, 183, 0, 0.1);
            border: 2px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 45px rgba(255, 183, 0, 0.3), inset 0 0 20px rgba(255, 183, 0, 0.2);
        }

        .activation-btn:hover {
            background: rgba(255, 183, 0, 0.3);
            box-shadow: 0 0 80px var(--accent), inset 0 0 40px var(--accent);
            transform: scale(1.04);
        }

        /* MAIN APP */
        #app {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        #app.active {
            display: flex;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 14px 22px;
            border-radius: 8px;
            backdrop-filter: blur(14px);
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.1);
        }

        .app-title {
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 183, 0, 0.5);
        }

        .api-input-box {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .api-input-box input {
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            flex-grow: 1;
            outline: none;
        }

        .api-input-box button {
            background: rgba(0, 243, 255, 0.2);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .api-input-box button:hover {
            background: rgba(0, 243, 255, 0.4);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-grow: 1;
        }

        @media(max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(16px);
            box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.08), 0 0 35px rgba(0, 0, 0, 0.8);
        }

        .interaction-panel {
            align-items: center;
            justify-content: space-between;
            text-align: center;
            min-height: 480px;
        }

        .hud-center-reactor {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            margin: 15px 0;
            background: radial-gradient(circle, rgba(255,183,0,0.15) 0%, rgba(0,243,255,0.05) 60%, transparent 100%);
            box-shadow: 0 0 60px rgba(255,183,0,0.3), inset 0 0 30px rgba(0,243,255,0.2);
            transition: all 0.4s;
        }

        .hud-center-reactor:hover {
            box-shadow: 0 0 90px rgba(255,183,0,0.7), inset 0 0 45px rgba(0,243,255,0.5);
            transform: scale(1.04);
        }

        .status-badge {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            background: rgba(0,0,0,0.8);
            padding: 5px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .dialogue-box {
            width: 100%;
            text-align: left;
            background: rgba(2, 8, 16, 0.9);
            padding: 14px 18px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            font-size: 0.85rem;
            margin: 10px 0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            box-shadow: inset 0 0 20px rgba(255,183,0,0.05);
        }

        .dialogue-user { color: var(--text-dim); }
        .dialogue-assistant { color: var(--accent); font-weight: 500; text-shadow: 0 0 10px rgba(255,183,0,0.4); }

        .controls-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .controls-row input {
            flex-grow: 1;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .controls-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .action-btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 243, 255, 0.35);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-danger {
            background: rgba(255, 61, 0, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(255, 61, 0, 0.4);
            box-shadow: 0 0 20px rgba(255,61,0,0.4);
        }

        .brain-panel {
            display: flex;
            flex-direction: column;
        }

        .brain-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .brain-title {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brain-stats {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .brain-btns {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .svg-container {
            flex-grow: 1;
            width: 100%;
            min-height: 340px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brain-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.75rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .injected-status {
            color: var(--accent);
            font-weight: 500;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 8, 0.92);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: rgba(2, 12, 24, 0.96);
            border: 1px solid var(--primary);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-card h3 {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .modal-card label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: -8px;
        }

        .modal-card input, .modal-card select, .modal-card textarea {
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        .modal-card textarea {
            resize: vertical;
            min-height: 95px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- CANVAS DE TEIAS NEURAIS (BIOLOGICAL WEBS + MATRIX RAIN) -->
    <canvas id="matrixCanvas"></canvas>

    <!-- BOOT SCREEN COM HUD OFICIAL JARVIS ROTATIVO -->
    <div id="bootScreen">
        <div class="mcu-hud-loader">
            <div class="hud-ring-gold"></div>
            <div class="hud-ring-blue"></div>
            <div class="hud-ring-dots"></div>
            <div class="hud-core-reactor">⚡</div>
        </div>
        <div class="boot-status">INICIALIZANDO HUD OFICIAL JARVIS...</div>
    </div>

    <!-- ACTIVATION SCREEN -->
    <div id="activationScreen">
        <div class="mcu-hud-loader" style="width: 150px; height: 150px;">
            <div class="hud-ring-gold"></div>
            <div class="hud-ring-blue"></div>
            <div class="hud-ring-dots"></div>
            <div class="hud-core-reactor" style="font-size: 1.3rem;">🧠</div>
        </div>
        <button class="activation-btn" id="btnActivate">ATIVAR SISTEMA OFICIAL</button>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <header class="top-bar">
            <div class="app-title">JARVIS // MCU OFFICIAL NEURAL HUD</div>
            <div class="api-input-box">
                <input type="password" id="apiKeyInput" placeholder="Cole sua Anthropic API Key...">
                <button id="btnSaveKey">Salvar</button>
            </div>
        </header>

        <div class="main-grid">
            <!-- PAINEL DE INTERAÇÃO -->
            <section class="panel interaction-panel">
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.8rem; color: var(--primary); font-weight: bold; letter-spacing: 1px;">ASSISTENTE PESSOAL</span>
                    <span id="statusBadge" class="status-badge">Ocioso</span>
                </div>

                <div class="hud-center-reactor" id="reactorOrb" title="Clique para interagir com Jarvis">
                    <div class="hud-ring-gold"></div>
                    <div class="hud-ring-blue"></div>
                    <div class="hud-core-reactor">⚡</div>
                </div>

                <div class="dialogue-box">
                    <div id="dialogueUser" class="dialogue-user">Você: --</div>
                    <div id="dialogueAssistant" class="dialogue-assistant">Jarvis: Sistemas operacionais ativos, Sandro. Como posso auxiliá-lo?</div>
                </div>

                <div class="controls-row">
                    <input type="text" id="textInput" placeholder="Faça uma pergunta ou dê uma ordem..."/>
                    <button id="btnMic" class="action-btn" title="Falar por voz">🎙️ Falar</button>
                    <button id="btnStopSpeech" class="action-btn btn-danger">Parar Fala</button>
                </div>
            </section>

            <!-- SECOND BRAIN -->
            <section class="panel brain-panel">
                <div class="brain-header">
                    <div class="brain-title">
                        <span>🧠 SECOND BRAIN</span>
                    </div>
                    <div class="brain-stats" id="brainStats">0 notas · 0 áreas</div>
                    <div class="brain-btns">
                        <button class="icon-btn" id="btnAddNote" title="Nova Nota">+</button>
                        <button class="icon-btn" id="btnReloadGraph" title="Recarregar Grafo">↻</button>
                    </div>
                </div>

                <div class="svg-container" id="svgContainer"></div>

                <div class="brain-footer">
                    <div class="legend-list" id="legendList"></div>
                    <div class="injected-status" id="injectedStatus">✓ teias neurais ativas com Claude API</div>
                </div>
            </section>
        </div>
    </div>

    <!-- MODAL EDITOR DE NOTAS -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <h3 id="modalTitle">Editar Nota</h3>
            <input type="hidden" id="editNoteId">
            
            <label>Título (1-2 palavras)</label>
            <input type="text" id="editNoteTitle" placeholder="Ex: Investimentos">
            
            <label>Área</label>
            <select id="editNoteArea"></select>
            
            <label>Conteúdo</label>
            <textarea id="editNoteBody" placeholder="Detalhes da nota..."></textarea>
            
            <div class="modal-actions">
                <button class="action-btn btn-danger" id="btnDeleteNote" style="margin-right: auto;">Excluir</button>
                <button class="action-btn" id="btnCancelModal" style="background: transparent; border-color: var(--text-dim);">Cancelar</button>
                <button class="action-btn" id="btnSaveNote">Salvar Nota</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            name: "Jarvis",
            address: "Sandro",
            model: "claude-3-5-sonnet-20241022",
            persona: "formal britânico (mordomo)"
        };

        const AREA = {
            meta: { label: "Identidade", color: "#64748b" },
            metas: { label: "Metas", color: "#38bdf8" },
            trabalho: { label: "Carreira", color: "#00f3ff" },
            projetos: { label: "Projetos", color: "#ffb700" },
            financas: { label: "Finanças", color: "#f7931a" },
            aprendizado: { label: "Aprendizado", color: "#38bdf8" },
            saude: { label: "Saúde", color: "#34d399" },
            relacoes: { label: "Relações", color: "#f472b6" }
        };

        const INITIAL_NOTES = [
            { id: "note_1", area: "meta", title: "Sandro Fagundes", body: "Sandro de Souza Fagundes, 40 anos, mora em Nova Hartz, trabalha em Dois Irmãos no Grupo Herval como cientista de dados e analista de indicadores corporativos. Licenciado em computação, ex-professor de informática, empreendedor com lojas online e criador de plataformas/dashboards via IA." },
            { id: "note_2", area: "metas", title: "Sanar Dores", body: "Meta geral: ajudar a sanar dores de processos corporativos com visão de futuro. Curto prazo: ajudar pessoas a desenvolver projetos e democratizar a criação." },
            { id: "note_3", area: "trabalho", title: "Grupo Herval", body: "Analista de indicadores corporativos e cientista de dados no Grupo Herval. Migrando dashboards do Power BI para o Apache Superset (melhorias nos charts). Montando dashboard para a 'Já Consórcios' (jornada de leads, simulações, distribuição e conversão)." },
            { id: "note_4", area: "projetos", title: "Plataforma Águas", body: "Plataforma de monitoramento de rios e cotas de inundação (Fase 1 completa, no Vercel). Objetivo: disponibilizar para prefeituras." },
            { id: "note_5", area: "projetos", title: "Motor IA com Voz", body: "Jarvis personal assistent — assistente inteligente operado por voz e texto integrado ao Second Brain neural." },
            { id: "note_6", area: "financas", title: "Investimentos", body: "Objetivos financeiros: aproveitar o dinheiro investindo em Bitcoin, Tesouro Direto, imóveis, viagens (Argentina, Patagônia e Cordilheira dos Andes)." },
            { id: "note_7", area: "aprendizado", title: "Estudos & IA", body: "Estuda veias culturais (com foco na asiática), livros de empreendedorismo, LLMs, IA, RPA, MCP, Cloud." },
            { id: "note_8", area: "saude", title: "Rotina & Família", body: "Acorda às 06:00, alongamento, fruta, cuida do filho, leva à escola, assiste desenho. Trabalho em outra cidade (carro). Sábados: bicicleta, caminhada e trilha. Adora boa comida e passeios com a família (esposa e filhos Heitor e Melissa)." }
        ];

        let NOTES = JSON.parse(localStorage.getItem("jarvis_notes")) || INITIAL_NOTES;
        let REL = [
            ["note_1", "note_2"], ["note_1", "note_3"], ["note_2", "note_4"],
            ["note_2", "note_5"], ["note_3", "note_4"], ["note_3", "note_5"],
            ["note_1", "note_6"], ["note_1", "note_7"], ["note_1", "note_8"]
        ];

        let chatHistory = [];
        let isBusy = false;
        let highlightedNoteId = null;
        let recognition = null;

        // CANVAS DE TEIA NEURAL COMPLEXA E CÓDIGO MATRIX EM CASCATA
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let matrixChars = "0101010101010101JARVISMCUARK";

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 90; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                radius: Math.random() * 2 + 1.0,
                char: matrixChars.charAt(Math.floor(Math.random() * matrixChars.length))
            });
        }

        function drawNeuralWebs() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#020408';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar teias de aranha / conexões neurais inteligentes
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                // Efeito Matrix de caracteres digitais discretos flutuando
                ctx.fillStyle = "rgba(0, 243, 255, 0.15)";
                ctx.font = "10px monospace";
                ctx.fillText(p.char, p.x, p.y);

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    // Formação de teias neurais (malha geométrica intrincada)
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 243, 255, ${(1 - dist / 150) * 0.3})`;
                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f3ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f3ff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(drawNeuralWebs);
        }
        drawNeuralWebs();

        // DOM Elements
        const bootScreen = document.getElementById("bootScreen");
        const activationScreen = document.getElementById("activationScreen");
        const app = document.getElementById("app");
        const btnActivate = document.getElementById("btnActivate");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const btnSaveKey = document.getElementById("btnSaveKey");
        const reactorOrb = document.getElementById("reactorOrb");
        const statusBadge = document.getElementById("statusBadge");
        const dialogueUser = document.getElementById("dialogueUser");
        const dialogueAssistant = document.getElementById("dialogueAssistant");
        const textInput = document.getElementById("textInput");
        const btnMic = document.getElementById("btnMic");
        const btnStopSpeech = document.getElementById("btnStopSpeech");
        const svgContainer = document.getElementById("svgContainer");
        const brainStats = document.getElementById("brainStats");
        const legendList = document.getElementById("legendList");
        const btnAddNote = document.getElementById("btnAddNote");
        const btnReloadGraph = document.getElementById("btnReloadGraph");
        const modalOverlay = document.getElementById("modalOverlay");
        const modalTitle = document.getElementById("modalTitle");
        const editNoteId = document.getElementById("editNoteId");
        const editNoteTitle = document.getElementById("editNoteTitle");
        const editNoteArea = document.getElementById("editNoteArea");
        const editNoteBody = document.getElementById("editNoteBody");
        const btnSaveNote = document.getElementById("btnSaveNote");
        const btnDeleteNote = document.getElementById("btnDeleteNote");
        const btnCancelModal = document.getElementById("btnCancelModal");

        window.addEventListener("DOMContentLoaded", () => {
            apiKeyInput.value = localStorage.getItem("anthropic_key") || "";
            editNoteArea.innerHTML = Object.entries(AREA).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
            setTimeout(() => {
                bootScreen.classList.add("fade-out");
                setTimeout(() => {
                    activationScreen.classList.add("show");
                }, 400);
            }, 2200);
        });

        btnSaveKey.addEventListener("click", () => {
            localStorage.setItem("anthropic_key", apiKeyInput.value.trim());
            speakText("Chave de API salva com sucesso, senhor.");
        });

        function getActiveApiKey() {
            return apiKeyInput.value.trim() || localStorage.getItem("anthropic_key") || "";
        }

        btnActivate.addEventListener("click", () => {
            activationScreen.classList.remove("show");
            app.classList.add("active");
            renderGraph();
            initVoiceRecognition();
            speakText("Sistemas operacionais ativos. À sua inteira disposição, Sandro.");
        });

        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = "pt-BR";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (transcript) {
                    dialogueUser.innerText = `Você: ${transcript}`;
                    processClaudeCommand(transcript);
                }
            };

            recognition.onerror = () => { statusBadge.innerText = "Ocioso"; };
            recognition.onend = () => { statusBadge.innerText = "Ocioso"; };
        }

        function triggerListening() {
            if (recognition && !isBusy) {
                try {
                    recognition.start();
                    statusBadge.innerText = "Ouvindo...";
                } catch(e) {
                    console.error(e);
                }
            }
        }

        btnMic.addEventListener("click", triggerListening);
        reactorOrb.addEventListener("click", triggerListening);

        btnStopSpeech.addEventListener("click", () => {
            window.speechSynthesis.cancel();
            isBusy = false;
            statusBadge.innerText = "Ocioso";
        });

        textInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && textInput.value.trim() !== "") {
                const query = textInput.value.trim();
                textInput.value = "";
                dialogueUser.innerText = `Você: ${query}`;
                processClaudeCommand(query);
            }
        });

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "pt-BR";
            utterance.rate = 1.0;
            utterance.pitch = 0.75;
            
            const voices = window.speechSynthesis.getVoices();
            let maleVoice = voices.find(v => v.lang.includes("pt") && !v.name.toLowerCase().includes("female")) || voices[0];
            if (maleVoice) utterance.voice = maleVoice;

            utterance.onstart = () => { isBusy = true; statusBadge.innerText = "Falando"; };
            utterance.onend = () => { isBusy = false; statusBadge.innerText = "Ocioso"; };
            
            window.speechSynthesis.speak(utterance);
        }

        // INTEGRAÇÃO COM A API DO CLAUDE & SECOND BRAIN VIVO
        async function processClaudeCommand(prompt) {
            const apiKey = getActiveApiKey();
            if (!apiKey) {
                const err = "Por favor, insira sua chave da Anthropic API no topo da página.";
                dialogueAssistant.innerText = `${CONFIG.name}: ${err}`;
                speakText("Insira sua chave de API na barra superior, senhor.");
                return;
            }

            isBusy = true;
            statusBadge.innerText = "Processando no Claude...";

            let notesText = NOTES.map(n => `- [${n.area.toUpperCase()}] ${n.title}: ${n.body}`).join("\n");
            const systemPrompt = `Você é o ${CONFIG.name}, um assistente pessoal com personalidade de ${CONFIG.persona}. Você atende ${CONFIG.address}. Suas respostas devem ser curtas (2-4 frases), faladas, sem emojis nem markdown em português do Brasil. 
            Regra de Memória Viva: Se o usuário revelar algo novo e duradouro, TERMINE a resposta com uma linha no formato EXATO [[SAVE:area|titulo|texto]] (area ∈ meta, metas, trabalho, projetos, financas, aprendizado, saude, relacoes).
            
            SECOND BRAIN (Notas atuais de ${CONFIG.address}):
            ${notesText}`;

            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "x-api-key": apiKey,
                        "anthropic-version": "2023-06-01",
                        "anthropic-dangerous-direct-browser-access": "true",
                        "content-type": "application/json"
                    },
                    body: JSON.stringify({
                        model: CONFIG.model,
                        max_tokens: 400,
                        system: systemPrompt,
                        messages: chatHistory.concat([{ role: "user", content: prompt }])
                    })
                });

                if (!response.ok) throw new Error("Erro na API Key ou de comunicação.");

                const data = await response.json();
                let rawText = data.content?.[0]?.text || "Sem resposta do sistema.";

                const saveRegex = /\[\[SAVE:([a-z_]+)\|([^|]+)\|([\s\S]+?)\]\]/;
                const match = rawText.match(saveRegex);
                if (match) {
                    const [, area, title, body] = match;
                    rawText = rawText.replace(saveRegex, "").trim();
                    upsertNote(area, title, body);
                }

                chatHistory.push({ role: "user", content: prompt });
                chatHistory.push({ role: "assistant", content: rawText });

                dialogueAssistant.innerText = `${CONFIG.name}: ${rawText}`;
                speakText(rawText);

            } catch (error) {
                console.error(error);
                const errText = "Erro ao comunicar com o Claude. Verifique sua chave de API.";
                dialogueAssistant.innerText = `${CONFIG.name}: ${errText}`;
                speakText("Falha de conexão com a API, senhor.");
                isBusy = false;
                statusBadge.innerText = "Ocioso";
            }
        }

        function upsertNote(area, title, body) {
            let existing = NOTES.find(n => n.title.toLowerCase() === title.toLowerCase());
            if (existing) {
                existing.area = area;
                existing.body = body;
                highlightedNoteId = existing.id;
            } else {
                const newId = "note_" + Date.now();
                NOTES.push({ id: newId, area, title, body });
                REL.push([newId, "note_1"]);
                highlightedNoteId = newId;
            }
            localStorage.setItem("jarvis_notes", JSON.stringify(NOTES));
            renderGraph();
            setTimeout(() => { highlightedNoteId = null; renderGraph(); }, 4000);
        }

        function renderGraph() {
            const width = svgContainer.clientWidth || 600;
            const height = svgContainer.clientHeight || 340;
            const cx = width / 2;
            const cy = height / 2;

            brainStats.innerText = `${NOTES.length} notas · ${new Set(NOTES.map(n => n.area)).size} áreas`;

            let usedAreas = [...new Set(NOTES.map(n => n.area))];
            legendList.innerHTML = usedAreas.map(a => `
                <div class="legend-item">
                    <span class="legend-dot" style="background: ${AREA[a]?.color || '#fff'}"></span>
                    <span>${AREA[a]?.label || a}</span>
                </div>
            `).join('');

            let connCounts = {};
            NOTES.forEach(n => connCounts[n.id] = 1);
            REL.forEach(([a, b]) => {
                if (connCounts[a]) connCounts[a]++;
                if (connCounts[b]) connCounts[b]++;
            });

            const radiusX = width * 0.36;
            const radiusY = height * 0.34;
            let nodeCoords = {};

            NOTES.forEach((note, idx) => {
                const angle = (idx / NOTES.length) * Math.PI * 2;
                nodeCoords[note.id] = {
                    x: cx + Math.cos(angle) * radiusX,
                    y: cy + Math.sin(angle) * radiusY,
                    note
                };
            });

            let svgContent = `
                <defs>
                    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffb700" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
                    </radialGradient>
                    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffb700"/>
                        <stop offset="100%" stop-color="#00f3ff"/>
                    </linearGradient>
                </defs>
            `;

            REL.forEach(([idA, idB]) => {
                if (nodeCoords[idA] && nodeCoords[idB]) {
                    const p1 = nodeCoords[idA];
                    const p2 = nodeCoords[idB];
                    const ctrlX = cx + (p1.x + p2.x - 2*cx) * 0.25;
                    const ctrlY = cy + (p1.y + p2.y - 2*cy) * 0.25;
                    svgContent += `<path d="M ${p1.x} ${p1.y} Q ${ctrlX} ${ctrlY} ${p2.x} ${p2.y}" stroke="url(#edgeGrad)" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4 4"/>`;
                }
            });

            Object.values(nodeCoords).forEach(node => {
                const color = AREA[node.note.area]?.color || '#00f3ff';
                svgContent += `<line x1="${cx}" y1="${cy}" x2="${node.x}" y2="${node.y}" stroke="${color}" stroke-width="0.8" opacity="0.3"/>`;
            });

            svgContent += `
                <circle cx="${cx}" cy="${cy}" r="38" fill="url(#coreGlow)"/>
                <circle cx="${cx}" cy="${cy}" r="22" fill="#020810" stroke="#ffb700" stroke-width="2"/>
                <text x="${cx}" y="${cy + 5}" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">🧠</text>
            `;

            Object.values(nodeCoords).forEach(node => {
                const color = AREA[node.note.area]?.color || '#00f3ff';
                const size = Math.min(18, 10 + (connCounts[node.note.id] || 1) * 1.5);
                const isHighlighted = node.note.id === highlightedNoteId;

                svgContent += `
                    <g class="node-group" cursor="pointer" onclick="openNoteEditor('${node.note.id}')">
                        ${isHighlighted ? `<circle cx="${node.x}" cy="${node.y}" r="${size + 6}" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="${size};${size+12};${size}" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/></circle>` : ''}
                        <circle cx="${node.x}" cy="${node.y}" r="${size + 4}" fill="${color}" opacity="0.25">
                            <animate attributeName="r" values="${size};${size+5};${size}" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="${node.x}" cy="${node.y}" r="${size}" fill="#020408" stroke="${color}" stroke-width="2"/>
                        <text x="${node.x}" y="${node.y + size + 14}" fill="#e2e8f0" font-size="10" text-anchor="middle" font-weight="500">${node.note.title}</text>
                    </g>
                `;
            });

            svgContainer.innerHTML = `<svg viewBox="0 0 ${width} ${height}">${svgContent}</svg>`;
        }

        btnReloadGraph.addEventListener("click", renderGraph);
        window.addEventListener("resize", renderGraph);

        function openNoteEditor(noteId = null) {
            if (noteId) {
                const note = NOTES.find(n => n.id === noteId);
                if (note) {
                    modalTitle.innerText = "Editar Nota";
                    editNoteId.value = note.id;
                    editNoteTitle.value = note.title;
                    editNoteArea.value = note.area;
                    editNoteBody.value = note.body;
                    btnDeleteNote.style.display = "block";
                }
            } else {
                modalTitle.innerText = "Nova Nota";
                editNoteId.value = "";
                editNoteTitle.value = "";
                editNoteArea.value = "projetos";
                editNoteBody.value = "";
                btnDeleteNote.style.display = "none";
            }
            modalOverlay.classList.add("open");
        }

        btnAddNote.addEventListener("click", () => openNoteEditor(null));
        btnCancelModal.addEventListener("click", () => modalOverlay.classList.remove("open"));

        btnSaveNote.addEventListener("click", () => {
            const id = editNoteId.value;
            const title = editNoteTitle.value.trim();
            const area = editNoteArea.value;
            const body = editNoteBody.value.trim();

            if (!title) return alert("Insira um título.");

            if (id) {
                let note = NOTES.find(n => n.id === id);
                if (note) {
                    note.title = title;
                    note.area = area;
                    note.body = body;
                }
            } else {
                const newId = "note_" + Date.now();
                NOTES.push({ id: newId, area, title, body });
                REL.push([newId, "note_1"]);
            }

            localStorage.setItem("jarvis_notes", JSON.stringify(NOTES));
            modalOverlay.classList.remove("open");
            renderGraph();
            speakText("Nota integrada no Second Brain, senhor.");
        });

        btnDeleteNote.addEventListener("click", () => {
            const id = editNoteId.value;
            if (id) {
                NOTES = NOTES.filter(n => n.id !== id);
                REL = REL.filter(([a, b]) => a !== id && b !== id);
                localStorage.setItem("jarvis_notes", JSON.stringify(NOTES));
                modalOverlay.classList.remove("open");
                renderGraph();
                speakText("Nota removida.");
            }
        });

        window.openNoteEditor = openNoteEditor;
    </script>
</body>
</html>
