<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis // Massive Warm Holographic HUD</title>
<style>
:root {
--bg-base: #020104;
--panel-bg: rgba(18, 8, 2, 0.90);
--border-color: rgba(255, 140, 0, 0.45);
--primary: #ff6600;
--accent: #ffb700;
--hud-glow: rgba(255, 140, 0, 0.55);
--text-main: #f1f5f9;
--text-dim: #94a3b8;
--danger: #ff3d00;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
html, body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: #020104; }
::-webkit-scrollbar-thumb { background: rgba(255, 100, 0, 0.4); border-radius: 2px; }

#hudCanvas {
position: fixed;
inset: 0;
z-index: 0;
pointer-events: none;
opacity: 0.95;
}

#bootScreen {
position: fixed;
inset: 0;
background: #020104;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 1000;
gap: 25px;
opacity: 1;
transition: opacity 0.8s ease-out;
}

#bootScreen.fade-out {
opacity: 0;
pointer-events: none;
}

.massive-warm-hud {
width: 340px;
height: 340px;
border-radius: 50%;
position: relative;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: radial-gradient(circle, rgba(255,140,0,0.22) 0%, transparent 75%);
box-shadow: 0 0 140px rgba(255, 140, 0, 0.4), inset 0 0 70px rgba(255, 183, 0, 0.25);
animation: warmPulse 2.2s infinite alternate ease-in-out;
text-align: center;
}

@keyframes warmPulse {
0% { transform: scale(0.96); box-shadow: 0 0 90px rgba(255, 100, 0, 0.35); }
100% { transform: scale(1.04); box-shadow: 0 0 160px rgba(255, 183, 0, 0.7); }
}

.hud-circle-1 {
position: absolute;
inset: 0;
border: 3px dashed var(--accent);
border-radius: 50%;
animation: spinClockwise 16s linear infinite;
}

.hud-circle-2 {
position: absolute;
inset: 15px;
border: 2px solid var(--primary);
border-top: 2px solid transparent;
border-bottom: 2px solid transparent;
border-radius: 50%;
animation: spinCounter 10s linear infinite;
}

.hud-circle-3 {
position: absolute;
inset: 40px;
border: 1px dotted rgba(255, 255, 255, 0.85);
border-radius: 50%;
animation: spinClockwise 6s linear infinite;
}

.hud-jarvis-text {
font-size: 2.5rem;
font-weight: bold;
letter-spacing: 5px;
color: var(--accent);
text-shadow: 0 0 20px var(--primary), 0 0 40px var(--accent);
z-index: 2;
}

.hud-online-text {
font-size: 1.3rem;
letter-spacing: 6px;
color: #ffffff;
text-shadow: 0 0 15px var(--primary);
margin-top: 5px;
z-index: 2;
}

@keyframes spinClockwise { to { transform: rotate(360deg); } }
@keyframes spinCounter { to { transform: rotate(-360deg); } }

.boot-status {
font-size: 0.85rem;
letter-spacing: 3px;
color: var(--accent);
text-shadow: 0 0 10px var(--primary);
animation: blink 1s infinite;
}

@keyframes blink { 0%, 49%, 100% { opacity: 1; } 50%, 99% { opacity: 0.3; } }

#activationScreen {
position: fixed;
inset: 0;
background: rgba(2, 1, 4, 0.96);
backdrop-filter: blur(14px);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 999;
gap: 35px;
opacity: 0;
pointer-events: none;
transition: opacity 0.6s ease-in;
}

#activationScreen.show {
opacity: 1;
pointer-events: all;
}

.activation-btn {
padding: 18px 50px;
font-size: 1.1rem;
letter-spacing: 3px;
color: var(--accent);
background: rgba(255, 100, 0, 0.2);
border: 2px solid var(--primary);
border-radius: 8px;
cursor: pointer;
font-weight: bold;
transition: all 0.3s;
box-shadow: 0 0 45px rgba(255, 100, 0, 0.4), inset 0 0 20px rgba(255, 183, 0, 0.3);
}

.activation-btn:hover {
background: rgba(255, 100, 0, 0.4);
box-shadow: 0 0 90px var(--primary), inset 0 0 40px var(--accent);
transform: scale(1.04);
}

#app {
display: none;
flex-direction: column;
min-height: 100vh;
width: 100%;
max-width: 1400px;
margin: 0 auto;
padding: 15px;
gap: 15px;
position: relative;
z-index: 10;
}

#app.active {
display: flex;
}

.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
background: var(--panel-bg);
border: 1px solid var(--border-color);
padding: 14px 22px;
border-radius: 8px;
backdrop-filter: blur(14px);
flex-wrap: wrap;
gap: 10px;
box-shadow: 0 0 35px rgba(255, 100, 0, 0.15);
}

.app-title {
font-weight: bold;
color: var(--accent);
letter-spacing: 2px;
text-shadow: 0 0 12px rgba(255, 183, 0, 0.5);
}

.api-input-box {
display: flex;
gap: 8px;
align-items: center;
width: 100%;
max-width: 450px;
}

.api-input-box input {
background: rgba(0,0,0,0.85);
border: 1px solid var(--border-color);
color: var(--accent);
padding: 6px 12px;
border-radius: 4px;
font-size: 0.85rem;
flex-grow: 1;
outline: none;
}

.main-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
flex-grow: 1;
}

@media(max-width: 900px) {
.main-grid { grid-template-columns: 1fr; }
}

.panel {
background: var(--panel-bg);
border: 1px solid var(--border-color);
border-radius: 10px;
padding: 22px;
display: flex;
flex-direction: column;
position: relative;
backdrop-filter: blur(16px);
box-shadow: inset 0 0 30px rgba(255, 100, 0, 0.08), 0 0 35px rgba(0, 0, 0, 0.8);
}

.interaction-panel {
align-items: center;
justify-content: space-between;
text-align: center;
min-height: 480px;
}

.reactor-container {
width: 220px;
height: 220px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
position: relative;
cursor: pointer;
margin: 15px 0;
background: radial-gradient(circle, rgba(255,100,0,0.2) 0%, transparent 70%);
box-shadow: 0 0 70px rgba(255, 100, 0, 0.35), inset 0 0 35px rgba(255, 183, 0, 0.25);
transition: all 0.4s;
}

.reactor-container.listening {
animation: warmPulse 0.4s infinite alternate ease-in-out;
box-shadow: 0 0 130px var(--primary), inset 0 0 40px var(--accent);
}

.ring-h1 { position: absolute; inset: 0; border: 2px dashed var(--accent); border-radius: 50%; animation: spinClockwise 12s linear infinite; }
.ring-h2 { position: absolute; inset: 15px; border: 2px solid var(--primary); border-top: 2px solid transparent; border-bottom: 2px solid transparent; border-radius: 50%; animation: spinCounter 7s linear infinite; }
.ring-h3 { position: absolute; inset: 32px; border: 1px dotted rgba(255, 255, 255, 0.8); border-radius: 50%; animation: spinClockwise 6s linear infinite; }
.ring-h4 { position: absolute; inset: 50px; border: 1.5px solid rgba(255, 183, 0, 0.6); border-left: 1.5px solid transparent; border-right: 1.5px solid transparent; border-radius: 50%; animation: spinCounter 4s linear infinite; }

.status-badge {
font-size: 0.75rem;
letter-spacing: 2px;
text-transform: uppercase;
color: var(--text-dim);
background: rgba(0,0,0,0.8);
padding: 5px 14px;
border-radius: 14px;
border: 1px solid var(--border-color);
}

.dialogue-box {
width: 100%;
text-align: left;
background: rgba(20, 8, 2, 0.9);
padding: 14px 18px;
border-radius: 8px;
border-left: 3px solid var(--accent);
font-size: 0.85rem;
margin: 10px 0;
min-height: 80px;
display: flex;
flex-direction: column;
justify-content: center;
gap: 6px;
box-shadow: inset 0 0 20px rgba(255,183,0,0.05);
}

.dialogue-user { color: var(--text-dim); }
.dialogue-assistant { color: var(--accent); font-weight: 500; text-shadow: 0 0 10px rgba(255,183,0,0.4); }

.controls-row {
display: flex;
gap: 10px;
width: 100%;
margin-top: 10px;
}

.controls-row input {
flex-grow: 1;
background: rgba(0,0,0,0.85);
border: 1px solid var(--border-color);
color: var(--text-main);
padding: 10px 14px;
border-radius: 6px;
font-size: 0.9rem;
outline: none;
transition: all 0.3s;
}

.controls-row button {
background: rgba(255, 100, 0, 0.2);
border: 1px solid var(--primary);
color: #fff;
padding: 10px 20px;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
transition: background 0.2s;
}
.controls-row button:hover { background: rgba(255, 100, 0, 0.4); }

.log-container {
font-size: 0.75rem;
color: var(--text-dim);
line-height: 1.5;
overflow-y: auto;
max-height: 400px;
padding: 10px;
background: rgba(0, 0, 0, 0.4);
border-radius: 6px;
border: 1px solid rgba(255, 100, 0, 0.15);
}
</style>
</head>
<body>

<canvas id="hudCanvas"></canvas>

<!-- TELA DE BOOT -->
<div id="bootScreen">
    <div class="massive-warm-hud">
        <div class="hud-circle-1"></div>
        <div class="hud-circle-2"></div>
        <div class="hud-circle-3"></div>
        <div class="hud-jarvis-text">JARVIS</div>
        <div class="hud-online-text">ONLINE</div>
    </div>
    <div class="boot-status">INICIALIZANDO PROTOCOLOS...</div>
</div>

<!-- TELA DE ATIVAÇÃO -->
<div id="activationScreen">
    <button class="activation-btn" id="activateBtn">INICIAR CONEXÃO COGNITIVA</button>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app">
    <div class="top-bar">
        <div class="app-title">JARVIS // INTELLIGENT HUD SYSTEM</div>
        <div class="api-input-box">
            <input type="password" id="apiKeyInput" placeholder="Insira sua Google AI Studio API Key...">
        </div>
    </div>

    <div class="main-grid">
        <!-- PAINEL DE INTERAÇÃO -->
        <div class="panel interaction-panel">
            <div class="status-badge" id="statusBadge">SISTEMA PRONTO</div>
            
            <div class="reactor-container" id="reactorBtn">
                <div class="ring-h1"></div>
                <div class="ring-h2"></div>
                <div class="ring-h3"></div>
                <div class="ring-h4"></div>
            </div>

            <div class="dialogue-box">
                <div class="dialogue-user" id="userText">Usuário: Aguardando comando de voz...</div>
                <div class="dialogue-assistant" id="jarvisText">Jarvis: Às suas ordens, Senhor.</div>
            </div>

            <div class="controls-row">
                <input type="text" id="manualInput" placeholder="Digite uma diretriz ou comando alternativo...">
