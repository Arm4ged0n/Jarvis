<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fagundes // Neural Assistant &amp; Second Brain</title>
<style>
    :root {
        --bg-base: #000205;
        --panel-bg: rgba(0, 242, 254, 0.03);
        --border-color: rgba(0, 242, 254, 0.5);
        --primary: #00f2fe;
        --primary-glow: rgba(0, 242, 254, 0.3);
        --text-main: #e2e8f0;
        --text-dim: #94a3b8;
        --danger: #ff3d00;
        --ok: #10b981;
        --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(1, 4, 9, 0.9); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 2px; }
    #app { display: flex; flex-direction: column; min-height: 100vh; width: 100%; max-width: 1400px; margin: 0 auto; padding: 15px; gap: 15px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 6px; backdrop-filter: blur(10px); flex-wrap: wrap; gap: 10px; }
    .api-input-box { display: flex; gap: 8px; align-items: center; width: 100%; max-width: 560px; }
    .api-input-box input { background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); color: var(--primary); padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; flex-grow: 1; outline: none; }
    .api-input-box button { background: rgba(0, 242, 254, 0.2); border: 1px solid var(--primary); color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; white-space: nowrap; }
    .api-input-box button:hover { background: rgba(0, 242, 254, 0.4); }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex-grow: 1; }
    @media(max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; position: relative; backdrop-filter: blur(10px); box-shadow: inset 0 0 20px var(--primary-glow); }
    .interaction-panel { align-items: center; justify-content: space-between; text-align: center; min-height: 480px; }
    .reactor-container { width: 140px; height: 140px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; margin: 15px 0; }
    .reactor-core { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, var(--primary) 0%, rgba(0,242,254,0.2) 70%, transparent 100%); box-shadow: 0 0 30px var(--primary); animation: reactorPulse 3s infinite ease-in-out; transition: background 0.3s; }
    .reactor-ring { position: absolute; inset: 0; border: 2px dashed rgba(0, 242, 254, 0.6); border-radius: 50%; animation: spinSlow 12s linear infinite; }
    .reactor-ring-2 { position: absolute; inset: -10px; border: 1px solid rgba(139, 124, 255, 0.4); border-radius: 50%; animation: spinReverse 18s linear infinite; }
    @keyframes reactorPulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 20px var(--primary); } 50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 45px var(--primary); } }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }
    .status-badge { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .dialogue-box { width: 100%; text-align: left; background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 6px; border-left: 3px solid var(--primary); font-size: 0.85rem; margin: 10px 0; min-height: 70px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .dialogue-user { color: var(--text-dim); }
    .dialogue-assistant { color: var(--primary); font-weight: 500; }
    .controls-row { display: flex; gap: 10px; width: 100%; margin-top: 10px; flex-wrap: wrap; }
    .controls-row input { flex: 1 1 180px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 4px; font-size: 0.9rem; outline: none; }
    .action-btn { background: rgba(0, 242, 254, 0.2); border: 1px solid var(--primary); color: #fff; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; white-space: nowrap; }
    .action-btn:hover { background: rgba(0, 242, 254, 0.4); }
    .btn-danger { background: rgba(255, 61, 0, 0.2); border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: rgba(255, 61, 0, 0.4); }
    .btn-live-on { background: rgba(16, 185, 129, 0.25); border-color: var(--ok); color: #d1fae5; }
 
    /* --- Faixa de comando pendente (fallback anti-popup-blocker) --- */
    .pending-open { display: none; width: 100%; margin-top: 10px; padding: 12px; border: 1px solid var(--warn); border-radius: 6px; background: rgba(251, 191, 36, 0.08); align-items: center; gap: 12px; text-align: left; }
    .pending-open.show { display: flex; }
    .pending-open p { font-size: 0.78rem; color: var(--warn); flex-grow: 1; line-height: 1.4; }
    .pending-open button { background: var(--warn); border: none; color: #1a1200; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; animation: reactorPulse 2s infinite ease-in-out; }
 
    .hint-line { font-size: 0.7rem; color: var(--text-dim); margin-top: 8px; line-height: 1.5; text-align: left; width: 100%; }
    .hint-line code { color: var(--primary); background: rgba(0,242,254,0.08); padding: 1px 5px; border-radius: 3px; }
 
    .brain-panel { display: flex; flex-direction: column; }
    .brain-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(0,242,254,0.2); padding-bottom: 8px; gap: 8px; flex-wrap: wrap; }
    .brain-title { font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .brain-stats { font-size: 0.75rem; color: var(--text-dim); }
    .brain-btns { display: flex; gap: 6px; }
    .icon-btn { background: rgba(0,242,254,0.1); border: 1px solid var(--border-color); color: var(--primary); min-width: 26px; height: 26px; padding: 0 6px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; }
    .icon-btn:hover { background: rgba(0,242,254,0.3); }
    .svg-container { flex-grow: 1; width: 100%; min-height: 340px; background: rgba(0,0,0,0.3); border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .svg-container svg { width: 100%; height: 100%; }
    .brain-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 0.75rem; flex-wrap: wrap; gap: 8px; }
    .legend-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .injected-status { color: var(--ok); font-weight: 500; }
