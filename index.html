<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senhor Fagundes — Jarvis HUD Core</title>
    <style>
        :root {
            --bg-base: #000402;
            --panel-bg: rgba(0, 255, 128, 0.02);
            --border-color: rgba(0, 255, 128, 0.45);
            --primary: #00ff80;
            --primary-glow: rgba(0, 255, 128, 0.35);
            --text-main: #e2e8f0;
            --text-dim: #8fa39b;
            --danger: #ff3d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        html, body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 10, 5, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 128, 0.4); border-radius: 2px; }

        /* CANVAS MATRIX & NEURAL BACKGROUND */
        #matrixCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.75;
        }

        /* TELA DE INICIALIZAÇÃO HOLOGRÁFICA (JARVIS HUD & MATRIX) */
        #bootScreen {
            position: fixed;
            inset: 0;
            background: #000402;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 30px;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #bootScreen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* HOLOGRAPHIC HUD ROTATING SPHERE */
        .jarvis-hud-loader {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0, 255, 128, 0.2);
        }

        .hud-ring-outer {
            position: absolute;
            inset: 0;
            border: 2px dashed rgba(0, 255, 128, 0.7);
            border-radius: 50%;
            animation: spinClockwise 10s linear infinite;
        }

        .hud-ring-inner {
            position: absolute;
            inset: 15px;
            border: 2px solid rgba(0, 255, 128, 0.4);
            border-top: 2px solid transparent;
            border-bottom: 2px solid transparent;
            border-radius: 50%;
            animation: spinCounter 6s linear infinite;
        }

        .hud-core-glow {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ff80 0%, rgba(0,255,128,0.2) 70%, transparent 100%);
            box-shadow: 0 0 35px #00ff80;
            animation: corePulse 1.8s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        @keyframes spinClockwise { to { transform: rotate(360deg); } }
        @keyframes spinCounter { to { transform: rotate(-360deg); } }
        @keyframes corePulse { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 55px #00ff80; } }

        .boot-status {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #00ff80;
            text-shadow: 0 0 12px rgba(0, 255, 128, 0.6);
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 49%, 100% { opacity: 1; } 50%, 99% { opacity: 0.3; } }

        /* ACTIVATION SCREEN */
        #activationScreen {
            position: fixed;
            inset: 0;
            background: rgba(0, 4, 2, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in;
        }

        #activationScreen.show {
            opacity: 1;
            pointer-events: all;
        }

        .activation-btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #00ff80;
            background: rgba(0, 255, 128, 0.1);
            border: 2px solid #00ff80;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(0, 255, 128, 0.3), inset 0 0 20px rgba(0, 255, 128, 0.2);
        }

        .activation-btn:hover {
            background: rgba(0, 255, 128, 0.3);
            box-shadow: 0 0 70px #00ff80, inset 0 0 35px #00ff80;
            transform: scale(1.04);
        }

        /* MAIN APP */
        #app {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        #app.active {
            display: flex;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 14px 22px;
            border-radius: 8px;
            backdrop-filter: blur(14px);
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.1);
        }

        .app-title {
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .status-info {
            font-size: 0.8rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 128, 0.4);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-grow: 1;
        }

        @media(max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(16px);
            box-shadow: inset 0 0 25px rgba(0, 255, 128, 0.1), 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .interaction-panel {
            align-items: center;
            justify-content: space-between;
            text-align: center;
            min-height: 480px;
        }

        /* HUD CENTRAL DO ASSISTENTE */
        .hud-center-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            margin: 15px 0;
            background: radial-gradient(circle, rgba(0,255,128,0.15) 0%, rgba(0,100,50,0.05) 60%, transparent 100%);
            box-shadow: 0 0 40px rgba(0,255,128,0.25), inset 0 0 25px rgba(0,255,128,0.2);
            transition: all 0.4s;
        }

        .hud-center-sphere:hover {
            box-shadow: 0 0 70px rgba(0,255,128,0.6), inset 0 0 40px rgba(0,255,128,0.4);
            transform: scale(1.04);
        }

        .status-badge {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            background: rgba(0,0,0,0.6);
            padding: 5px 14px;
            border-radius: 14px;
            border: 1px solid rgba(0,255,128,0.3);
        }

        .dialogue-box {
            width: 100%;
            text-align: left;
            background: rgba(0, 6, 3, 0.85);
            padding: 14px 18px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
            font-size: 0.85rem;
            margin: 10px 0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            box-shadow: inset 0 0 15px rgba(0,255,128,0.05);
        }

        .dialogue-user { color: var(--text-dim); }
        .dialogue-assistant { color: var(--primary); font-weight: 500; text-shadow: 0 0 8px rgba(0,255,128,0.3); }

        .controls-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .controls-row input {
            flex-grow: 1;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .controls-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0,255,128,0.3);
        }

        .action-btn {
            background: rgba(0, 255, 128, 0.15);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 255, 128, 0.35);
            box-shadow: 0 0 15px rgba(0,255,128,0.4);
        }

        .btn-danger {
            background: rgba(255, 61, 0, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(255, 61, 0, 0.4);
            box-shadow: 0 0 15px rgba(255,61,0,0.4);
        }

        .brain-panel {
            display: flex;
            flex-direction: column;
        }

        .brain-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(0,255,128,0.2);
            padding-bottom: 8px;
        }

        .brain-title {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brain-stats {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .brain-btns {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(0,255,128,0.1);
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0,255,128,0.3);
            box-shadow: 0 0 10px rgba(0,255,128,0.4);
        }

        .svg-container {
            flex-grow: 1;
            width: 100%;
            min-height: 340px;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brain-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.75rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .injected-status {
            color: #10b981;
            font-weight: 500;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,4,2,0.88);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: rgba(0, 15, 8, 0.96);
            border: 1px solid var(--primary);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0, 255, 128, 0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-card h3 {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .modal-card label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: -8px;
        }

        .modal-card input, .modal-card select, .modal-card textarea {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        .modal-card textarea {
            resize: vertical;
            min-height: 95px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- CANVAS MATRIX DIGITAL RAIN & NEURAL NETWORK -->
    <canvas id="matrixCanvas"></canvas>

    <!-- BOOT SCREEN COM HOLOGRAMA ROTATIVO ESTILO JARVIS/MATRIX -->
    <div id="bootScreen">
        <div class="jarvis-hud-loader">
            <div class="hud-ring-outer"></div>
            <div class="hud-ring-inner"></div>
            <div class="hud-core-glow">🌐</div>
        </div>
        <div class="boot-status">ESTABELECENDO LIGAÇÃO HOLOGRÁFICA...</div>
    </div>

    <!-- ACTIVATION SCREEN -->
    <div id="activationScreen">
        <div class="jarvis-hud-loader" style="width: 130px; height: 130px;">
            <div class="hud-ring-outer"></div>
            <div class="hud-ring-inner"></div>
            <div class="hud-core-glow" style="font-size: 1.4rem;">⚡</div>
        </div>
        <button class="activation-btn" id="btnActivate">ATIVAR NÚCLEO JARVIS</button>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <header class="top-bar">
            <div class="app-title">JARVIS // HOLOGRAPHIC CORE</div>
            <div class="status-info">● NÚCLEO VERDE CIBERNÉTICO ATIVO</div>
        </header>

        <div class="main-grid">
            <!-- PAINEL DE INTERAÇÃO -->
            <section class="panel interaction-panel">
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.8rem; color: var(--primary); font-weight: bold; letter-spacing: 1px;">ASSISTENTE PESSOAL</span>
                    <span id="statusBadge" class="status-badge">Ocioso</span>
                </div>

                <div class="hud-center-sphere" id="reactorOrb" title="Clique para falar com Jarvis">
                    <div class="hud-ring-outer"></div>
                    <div class="hud-ring-inner"></div>
                    <div class="hud-core-glow">🧠</div>
                </div>

                <div class="dialogue-box">
                    <div id="dialogueUser" class="dialogue-user">Você: --</div>
                    <div id="dialogueAssistant" class="dialogue-assistant">Jarvis: Sistemas online, Sandro. Como posso auxiliá-lo?</div>
                </div>

                <div class="controls-row">
                    <input type="text" id="textInput" placeholder="Faça uma pergunta ou dê uma ordem..."/>
                    <button id="btnMic" class="action-btn" title="Falar por voz">🎙️ Falar</button>
                    <button id="btnStopSpeech" class="action-btn btn-danger">Parar Fala</button>
                </div>
            </section>

            <!-- SECOND BRAIN -->
            <section class="panel brain-panel">
                <div class="brain-header">
                    <div class="brain-title">
                        <span>🧠 SECOND BRAIN</span>
                    </div>
                    <div class="brain-stats" id="brainStats">0 notas · 0 áreas</div>
                    <div class="brain-btns">
                        <button class="icon-btn" id="btnAddNote" title="Nova Nota">+</button>
                        <button class="icon-btn" id="btnReloadGraph" title="Recarregar Grafo">↻</button>
                    </div>
                </div>

                <div class="svg-container" id="svgContainer"></div>

                <div class="brain-footer">
                    <div class="legend-list" id="legendList"></div>
                    <div class="injected-status" id="injectedStatus">✓ motor neural holográfico ativo</div>
                </div>
            </section>
        </div>
    </div>

    <!-- MODAL EDITOR DE NOTAS -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <h3 id="modalTitle">Editar Nota</h3>
            <input type="hidden" id="editNoteId">
            
            <label>Título (1-2 palavras)</label>
            <input type="text" id="editNoteTitle" placeholder="Ex: Investimentos">
            
            <label>Área</label>
            <select id="editNoteArea"></select>
            
            <label>Conteúdo</label>
            <textarea id="editNoteBody" placeholder="Detalhes da nota..."></textarea>
            
            <div class="modal-actions">
                <button class="action-btn btn-danger" id="btnDeleteNote" style="margin-right: auto;">Excluir</button>
                <button class="action-btn" id="btnCancelModal" style="background: transparent; border-color: var(--text-dim);">Cancelar</button>
                <button class="action-btn" id="btnSaveNote">Salvar Nota</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            name: "Jarvis",
            address: "Sandro",
            persona: "formal britânico (mordomo)"
        };

        const AREA = {
            meta: { label: "Identidade", color: "#8a90a6" },
            metas: { label: "Metas", color: "#fbbf24" },
            trabalho: { label: "Carreira", color: "#00ff80" },
            projetos: { label: "Projetos", color: "#8b7cff" },
            financas: { label: "Finanças", color: "#f7931a" },
            aprendizado: { label: "Aprendizado", color: "#2dd4ff" },
            saude: { label: "Saúde", color: "#10b981" },
            relacoes: { label: "Relações", color: "#ec4899" }
        };

        const INITIAL_NOTES = [
            { id: "note_1", area: "meta", title: "Perfil Geral", body: "Profissional especialista em ciência de dados e indicadores corporativos, atuando com desenvolvimento de plataformas analíticas e inteligência artificial." },
            { id: "note_2", area: "metas", title: "Sanar Dores", body: "Objetivo de automatizar processos corporativos e democratizar o acesso à tecnologia e criação de projetos." },
            { id: "note_3", area: "trabalho", title: "Analytics Core", body: "Construção de painéis interativos avançados, transformando dados brutos em inteligência acionável para tomada de decisão gerencial." },
            { id: "note_4", area: "projetos", title: "Monitoramento de Rios", body: "Plataforma de monitoramento de cotas de inundação com site ativo em nuvem, focada em prevenção de riscos para prefeituras." },
            { id: "note_5", area: "projetos", title: "Motor IA com Voz", body: "Ecossistema de assistência inteligente operado por comandos de voz e redes neurais locais." },
            { id: "note_6", area: "financas", title: "Investimentos", body: "Estratégia diversificada em ativos de renda fixa, ouro, criptomoedas e reservas para expedições de viagem." },
            { id: "note_7", area: "aprendizado", title: "Automação & IA", body: "Estudo contínuo de fluxos inteligentes, ferramentas de nuvem e arquitetura de sistemas." }
        ];

        let NOTES = JSON.parse(localStorage.getItem("jarvis_notes")) || INITIAL_NOTES;
        let REL = [
            ["note_1", "note_2"], ["note_1", "note_3"], ["note_2", "note_4"],
            ["note_2", "note_5"], ["note_3", "note_4"], ["note_3", "note_5"],
            ["note_1", "note_6"], ["note_1", "note_7"]
        ];

        let isBusy = false;
        let highlightedNoteId = null;
        let recognition = null;

        // CANVAS MATRIX DIGITAL RAIN & NEURAL HUD EM BACKGROUND
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 75; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2 + 1.2
            });
        }

        function drawMatrixHUD() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000402';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linhas sinápticas em verde neon Matrix
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 255, 128, ${(1 - dist / 150) * 0.4})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00ff80';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ff80';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(drawMatrixHUD);
        }
        drawMatrixHUD();

        // DOM Elements
        const bootScreen = document.getElementById("bootScreen");
        const activationScreen = document.getElementById("activationScreen");
        const app = document.getElementById("app");
        const btnActivate = document.getElementById("btnActivate");
        const reactorOrb = document.getElementById("reactorOrb");
        const statusBadge = document.getElementById("statusBadge");
        const dialogueUser = document.getElementById("dialogueUser");
        const dialogueAssistant = document.getElementById("dialogueAssistant");
        const textInput = document.getElementById("textInput");
        const btnMic = document.getElementById("btnMic");
        const btnStopSpeech = document.getElementById("btnStopSpeech");
        const svgContainer = document.getElementById("svgContainer");
        const brainStats = document.getElementById("brainStats");
        const legendList = document.getElementById("legendList");
        const btnAddNote = document.getElementById("btnAddNote");
        const btnReloadGraph = document.getElementById("btnReloadGraph");
        const modalOverlay = document.getElementById("modalOverlay");
        const modalTitle = document.getElementById("modalTitle");
        const editNoteId = document.getElementById("editNoteId");
        const editNoteTitle = document.getElementById("editNoteTitle");
        const editNoteArea = document.getElementById("editNoteArea");
        const editNoteBody = document.getElementById("editNoteBody");
        const btnSaveNote = document.getElementById("btnSaveNote");
        const btnDeleteNote = document.getElementById("btnDeleteNote");
        const btnCancelModal = document.getElementById("btnCancelModal");

        window.addEventListener("DOMContentLoaded", () => {
            editNoteArea.innerHTML = Object.entries(AREA).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
            setTimeout(() => {
                bootScreen.classList.add("fade-out");
                setTimeout(() => {
                    activationScreen.classList.add("show");
                }, 400);
            }, 2200);
        });

        btnActivate.addEventListener("click", () => {
            activationScreen.classList.remove("show");
            app.classList.add("active");
            renderGraph();
            initVoiceRecognition();
            speakText("Sistemas holográficos online. À sua inteira disposição, Sandro.");
        });

        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = "pt-BR";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (transcript) {
                    dialogueUser.innerText = `Você: ${transcript}`;
                    processIntelligentPrompt(transcript);
                }
            };

            recognition.onerror = () => { statusBadge.innerText = "Ocioso"; };
            recognition.onend = () => { statusBadge.innerText = "Ocioso"; };
        }

        function triggerListening() {
            if (recognition && !isBusy) {
                try {
                    recognition.start();
                    statusBadge.innerText = "Ouvindo...";
                } catch(e) {
                    console.error(e);
                }
            }
        }

        btnMic.addEventListener("click", triggerListening);
        reactorOrb.addEventListener("click", triggerListening);

        btnStopSpeech.addEventListener("click", () => {
            window.speechSynthesis.cancel();
            isBusy = false;
            statusBadge.innerText = "Ocioso";
        });

        textInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && textInput.value.trim() !== "") {
                const query = textInput.value.trim();
                textInput.value = "";
                dialogueUser.innerText = `Você: ${query}`;
                processIntelligentPrompt(query);
            }
        });

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "pt-BR";
            utterance.rate = 1.0;
            utterance.pitch = 0.75;
            
            const voices = window.speechSynthesis.getVoices();
            let maleVoice = voices.find(v => v.lang.includes("pt") && !v.name.toLowerCase().includes("female")) || voices[0];
            if (maleVoice) utterance.voice = maleVoice;

            utterance.onstart = () => { isBusy = true; statusBadge.innerText = "Falando"; };
            utterance.onend = () => { isBusy = false; statusBadge.innerText = "Ocioso"; };
            
            window.speechSynthesis.speak(utterance);
        }

        function processIntelligentPrompt(prompt) {
            isBusy = true;
            statusBadge.innerText = "Processando Holograma...";

            setTimeout(() => {
                const lower = prompt.toLowerCase();
                let responseText = "";

                if (lower.includes("abrir youtube") || lower.includes("youtube")) {
                    window.open("https://youtube.com", "_blank");
                    responseText = "Abrindo o YouTube imediatamente, senhor.";
                } else if (lower.includes("abrir spotify") || lower.includes("spotify")) {
                    window.open("https://open.spotify.com", "_blank");
                    responseText = "Acessando o seu Spotify.";
                } else {
                    let matchedNotes = NOTES.filter(n => {
                        const content = (n.title + " " + n.body + " " + n.area).toLowerCase();
                        return prompt.toLowerCase().split(' ').some(word => word.length > 3 && content.includes(word));
                    });

                    if (matchedNotes.length > 0) {
                        highlightedNoteId = matchedNotes[0].id;
                        renderGraph();
                        setTimeout(() => { highlightedNoteId = null; renderGraph(); }, 4000);

                        const summaries = matchedNotes.map(n => n.body).join(" Além disso, ");
                        responseText = `Com base nos registros holográficos: ${summaries}. Sugiro mantermos o foco nestas diretrizes estratégicas.`;
                    } else {
                        responseText = "Analisei sua questão com base nas diretrizes do sistema. Compreendo perfeitamente o seu raciocínio e permaneço pronto para executar novas demandas.";
                    }
                }

                dialogueAssistant.innerText = `Jarvis: ${responseText}`;
                speakText(responseText);
            }, 600);
        }

        function upsertNote(area, title, body) {
            let existing = NOTES.find(n => n.title.toLowerCase() === title.toLowerCase());
            if (existing) {
                existing.area = area;
                existing.body = body;
                highlightedNoteId = existing.id;
            } else {
                const newId = "note_" + Date.now();
                NOTES.push({ id: newId, area, title, body });
                REL.push([newId, "note_1"]);
                highlightedNoteId = newId;
            }
            localStorage.setItem("jarvis_notes", JSON.stringify(NOTES));
            renderGraph();
            setTimeout(() => { highlightedNoteId = null; renderGraph(); }, 3000);
        }

        function renderGraph() {
            const width = svgContainer.clientWidth || 600;
            const height = svgContainer.clientHeight || 340;
            const cx = width / 2;
            const cy = height / 2;

            brainStats.innerText = `${NOTES.length} notas · ${new Set(NOTES.map(n => n.area)).size} áreas`;

            let usedAreas = [...new Set(NOTES.map(n => n.area))];
            legendList.innerHTML = usedAreas.map(a => `
                <div class="legend-item">
                    <span class="legend-dot" style="background: ${AREA[a]?.color || '#fff'}"></span>
                    <span>${AREA[a]?.label || a}</span>
                </div>
            `).join('');

            let connCounts = {};
            NOTES.forEach(n => connCounts[n.id] = 1);
            REL.forEach(([a, b]) => {
                if (connCounts[a]) connCounts[a]++;
                if (connCounts[b]) connCounts[b]++;
            });

            const radiusX = width * 0.36;
            const radiusY = height * 0.34;
            let nodeCoords = {};

            NOTES.forEach((note, idx) => {
                const angle = (idx / NOTES.length) * Math.PI * 2;
                nodeCoords[note.id] = {
                    x: cx + Math.cos(angle) * radiusX,
                    y: cy + Math.sin(angle) * radiusY,
                    note
                };
            });

            let svgContent = `
                <defs>
                    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#00ff80" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#8b7cff" stop-opacity="0"/>
                    </radialGradient>
                    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00ff80"/>
                        <stop offset="100%" stop-color="#8b7cff"/>
                    </linearGradient>
                </defs>
            `;

            REL.forEach(([idA, idB]) => {
                if (nodeCoords[idA] && nodeCoords[idB]) {
                    const p1 = nodeCoords[idA];
                    const p2 = nodeCoords[idB];
                    const ctrlX = cx + (p1.x + p2.x - 2*cx) * 0.25;
                    const ctrlY = cy + (p1.y + p2.y - 2*cy) * 0.25;
                    svgContent += `<path d="M ${p1.x} ${p1.y} Q ${ctrlX} ${ctrlY} ${p2.x} ${p2.y}" stroke="url(#edgeGrad)" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4 4"/>`;
                }
            });

            Object.values(nodeCoords).forEach(node => {
                const color = AREA[node.note.area]?.color || '#00ff80';
                svgContent += `<line x1="${cx}" y1="${cy}" x2="${node.x}" y2="${node.y}" stroke="${color}" stroke-width="0.8" opacity="0.3"/>`;
            });

            svgContent += `
                <circle cx="${cx}" cy="${cy}" r="38" fill="url(#coreGlow)"/>
                <circle cx="${cx}" cy="${cy}" r="22" fill="#001a0d" stroke="#8b7cff" stroke-width="2"/>
                <text x="${cx}" y="${cy + 5}" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">🧠</text>
            `;

            Object.values(nodeCoords).forEach(node => {
                const color = AREA[node.note.area]?.color || '#00ff80';
                const size = Math.min(18, 10 + (connCounts[node.note.id] || 1) * 1.5);
                const isHighlighted = node.note.id === highlightedNoteId;

                svgContent += `
                    <g class="node-group" cursor="pointer" onclick="openNoteEditor('${node.note.id}')">
                        ${isHighlighted ? `<circle cx="${node.x}" cy="${node.y}" r="${size + 6}" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="${size};${size+12};${size}" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/></circle>` : ''}
                        <circle cx="${node.x}" cy="${node.y}" r="${size + 4}" fill="${color}" opacity="0.25">
                            <animate attributeName="r" values="${size};${size+5};${size}" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="${node.x}" cy="${node.y}" r="${size}" fill="#000402" stroke="${color}" stroke-width="2"/>
                        <text x="${node.x}" y="${node.y + size + 14}" fill="#e2e8f0" font-size="10" text-anchor="middle" font-weight="500">${node.note.title}</text>
                    </g>
                `;
            });

            svgContainer.innerHTML = `<svg viewBox="0 0 ${width} ${height}">${svgContent}</svg>`;
        }

        btnReloadGraph.addEventListener("click", renderGraph);
        window.addEventListener("resize", renderGraph);

        function openNoteEditor(noteId = null) {
            if (noteId) {
                const note = NOTES.find(n => n.id === noteId);
                if (note) {
                    modalTitle.innerText = "Editar Nota";
                    editNoteId.value = note.id;
                    editNoteTitle.value = note.title;
                    editNoteArea.value = note.area;
                    editNoteBody.value = note.body;
                    btnDeleteNote.style.display = "block";
                }
            } else {
                modalTitle.innerText = "Nova Nota";
                editNoteId.value = "";
                editNoteTitle.value = "";
                editNoteArea.value = "projetos";
                editNoteBody.value = "";
                btnDeleteNote.style.display = "none";
            }
            modalOverlay.classList.add("open");
        }

        btnAddNote.addEventListener("click", () => openNoteEditor(null));
        btnCancelModal.addEventListener("click", () => modalOverlay.classList.remove("open"));

        btnSaveNote.addEventListener("click", () => {
            const id = editNoteId.value;
            const title = editNoteTitle.value.trim();
            const area = editNoteArea.value;
            const body = editNoteBody.value.trim();

            if (!title) return alert("Insira um título.");

            if (id) {
                let note = NOTES.find(n => n.id === id);
                if (note) {
                    note.title = title;
                    note.area = area;
                    note.body = body;
                }
            } else {
                const newId = "note_" + Date.now();
                NOTES.push({ id: newId, area, title, body });
                REL.push([newId, "note_1"]);
            }

            localStorage.setItem("jarvis_notes", JSON.stringify(NOTES));
            modalOverlay.classList.remove("open");
            renderGraph();
            speakText("Nota integrada na matriz neural, senhor.");
        });

        btnDeleteNote.addEventListener("click", () => {
            const id = editNoteId.value;
            if (id) {
                NOTES = NOTES.filter(n => n.id !== id);
                REL = REL.filter(([a, b]) => a !== id && b !== id);
                localStorage.setItem("jarvis_notes", JSON.stringify(NOTES));
                modalOverlay.classList.remove("open");
                renderGraph();
                speakText("Nota removida.");
            }
        });

        window.openNoteEditor = openNoteEditor;
    </script>
</body>
</html>
