<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anúbis — Assistente Pessoal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f7931a;
            --gold-light: #fbbf24;
            --gold-dark: #d97706;
            --dark-bg: #0f0a1a;
            --dark-secondary: #1a1426;
            --text-primary: #f5f5f5;
            --text-secondary: #b8b8b8;
            --purple: #9f7aea;
            --cyan: #2dd4ff;
            --status-ok: #10b981;
            --status-listening: #f59e0b;
            --status-thinking: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a0f2e 100%);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* BOOT SCREEN */
        /* ═══════════════════════════════════════════════════════════════════════ */
        
        .boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a0f2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-out;
        }

        .boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .boot-title {
            font-family: 'Courier New', monospace;
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: bold;
            background: linear-gradient(90deg, var(--gold) 0%, var(--purple) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(247, 147, 26, 0.3);
        }

        .boot-line {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--purple), var(--gold));
            margin: 2rem 0;
            box-shadow: 0 0 15px rgba(247, 147, 26, 0.5);
        }

        .boot-status {
            font-size: 1.1rem;
            color: var(--gold);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        .boot-version {
            position: absolute;
            bottom: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* ACTIVATION SCREEN */
        /* ═══════════════════════════════════════════════════════════════════════ */

        .activation-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a0f2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            opacity: 1;
            transition: opacity 0.6s ease-out;
        }

        .activation-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .activation-title {
            font-family: 'Courier New', monospace;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: bold;
            background: linear-gradient(90deg, var(--gold) 0%, var(--purple) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-shadow: 0 0 30px rgba(247, 147, 26, 0.3);
        }

        .activation-button {
            padding: 1.2rem 3rem;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--dark-bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(247, 147, 26, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .activation-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(247, 147, 26, 0.6);
        }

        .activation-button:active {
            transform: scale(0.98);
        }

        .activation-text {
            font-size: 1rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* MAIN APP */
        /* ═══════════════════════════════════════════════════════════════════════ */

        .app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-out;
            z-index: 1;
        }

        .app-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .app-top {
            flex: 0 0 auto;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(247, 147, 26, 0.2);
            background: linear-gradient(180deg, var(--dark-secondary) 0%, transparent 100%);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .app-name {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .api-key-input {
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.9rem;
            max-width: 300px;
            font-family: monospace;
        }

        .api-key-input::placeholder {
            color: var(--text-secondary);
        }

        .api-key-input:focus {
            outline: none;
            border-color: var(--gold-light);
            box-shadow: 0 0 10px rgba(247, 147, 26, 0.3);
        }

        .status-line {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            margin-bottom: 0.5rem;
        }

        .status-line.user {
            color: var(--gold);
        }

        .status-line.assistant {
            color: var(--cyan);
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* CENTER SECTION — ORB + CONVERSATION */
        /* ═══════════════════════════════════════════════════════════════════════ */

        .app-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .orb-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            cursor: pointer;
        }

        .orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold), var(--gold-dark));
            box-shadow: 
                0 0 40px rgba(247, 147, 26, 0.6),
                inset -10px -10px 20px rgba(0, 0, 0, 0.5),
                inset 10px 10px 20px rgba(255, 255, 255, 0.1);
            animation: orb-pulse 2s ease-in-out infinite;
        }

        @keyframes orb-pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(247, 147, 26, 0.6), inset -10px -10px 20px rgba(0, 0, 0, 0.5), inset 10px 10px 20px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 60px rgba(247, 147, 26, 0.8), inset -10px -10px 20px rgba(0, 0, 0, 0.5), inset 10px 10px 20px rgba(255, 255, 255, 0.15); }
        }

        .orb.listening {
            animation: orb-wave 1s ease-in-out infinite;
        }

        @keyframes orb-wave {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .orb.thinking {
            animation: orb-think 0.6s ease-in-out infinite;
        }

        @keyframes orb-think {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(5deg); }
        }

        .orb-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            opacity: 0.3;
            animation: orb-ring-breathe 2.5s ease-in-out infinite;
        }

        @keyframes orb-ring-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.1; }
        }

        .conversation-area {
            text-align: center;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .conversation-line {
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0.5rem 0;
            min-height: 1.5rem;
        }

        .user-line {
            color: var(--gold);
            font-family: 'Courier New', monospace;
        }

        .assistant-line {
            color: var(--cyan);
            font-family: 'Courier New', monospace;
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* INPUT SECTION */
        /* ═══════════════════════════════════════════════════════════════════════ */

        .app-input-section {
            flex: 0 0 auto;
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(247, 147, 26, 0.2);
            background: linear-gradient(180deg, transparent 0%, var(--dark-secondary) 100%);
        }

        .input-wrapper {
            display: flex;
            gap: 0.8rem;
            align-items: stretch;
        }

        .text-input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(247, 147, 26, 0.3);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .text-input::placeholder {
            color: var(--text-secondary);
        }

        .text-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(247, 147, 26, 0.3);
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-control {
            padding: 0.8rem 1rem;
            background: rgba(247, 147, 26, 0.2);
            border: 1px solid var(--gold);
            border-radius: 4px;
            color: var(--gold);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-control:hover {
            background: rgba(247, 147, 26, 0.3);
            box-shadow: 0 0 10px rgba(247, 147, 26, 0.3);
        }

        .btn-control:active {
            transform: scale(0.95);
        }

        .btn-control.active {
            background: var(--gold);
            color: var(--dark-bg);
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* SECOND BRAIN SECTION */
        /* ═══════════════════════════════════════════════════════════════════════ */

        .second-brain-container {
            flex: 0 0 auto;
            max-height: 280px;
            overflow: hidden;
            border-top: 1px solid rgba(247, 147, 26, 0.2);
            background: linear-gradient(180deg, transparent 0%, var(--dark-secondary) 100%);
        }

        .brain-header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(247, 147, 26, 0.1);
        }

        .brain-title {
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .brain-title strong {
            color: var(--gold);
        }

        .brain-stats {
            font-size: 0.8rem;
            color: var(--status-ok);
            font-family: 'Courier New', monospace;
        }

        .brain-controls {
            display: flex;
            gap: 0.4rem;
        }

        .btn-brain {
            padding: 0.4rem 0.8rem;
            background: rgba(247, 147, 26, 0.15);
            border: 1px solid rgba(247, 147, 26, 0.4);
            border-radius: 3px;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-brain:hover {
            background: rgba(247, 147, 26, 0.25);
        }

        .graph-container {
            padding: 1rem 1.5rem;
            height: 240px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* MODAL — NOTA EDITOR */
        /* ═══════════════════════════════════════════════════════════════════════ */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--dark-secondary);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 40px rgba(247, 147, 26, 0.3);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 1.5rem;
            font-family: 'Courier New', monospace;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(247, 147, 26, 0.3);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(247, 147, 26, 0.3);
        }

        .form-select option {
            background: var(--dark-secondary);
            color: var(--text-primary);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn-modal {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-modal.primary {
            background: var(--gold);
            color: var(--dark-bg);
        }

        .btn-modal.primary:hover {
            background: var(--gold-light);
            box-shadow: 0 0 15px rgba(247, 147, 26, 0.4);
        }

        .btn-modal.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
        }

        .btn-modal.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--text-primary);
        }

        .btn-modal.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .btn-modal.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* RESPONSIVO */
        /* ═══════════════════════════════════════════════════════════════════════ */

        @media (max-width: 768px) {
            .api-key-input {
                max-width: 200px;
                font-size: 0.8rem;
            }

            .orb-container {
                width: 140px;
                height: 140px;
            }

            .orb {
                width: 120px;
                height: 120px;
            }

            .orb-ring {
                width: 140px;
                height: 140px;
            }

            .conversation-area {
                max-width: 90%;
            }

            .modal-box {
                width: 95%;
            }

            .control-buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn-control {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .app-top {
                padding: 1rem;
            }

            .app-center {
                padding: 1rem;
            }

            .app-input-section {
                padding: 1rem;
            }

            .activation-title {
                font-size: 2rem;
            }

            .app-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- BOOT SCREEN -->
    <div class="boot-screen" id="bootScreen">
        <div class="boot-title">ANÚBIS</div>
        <div class="boot-line"></div>
        <div class="boot-status">SINCRONIZANDO DADOS...</div>
        <div class="boot-version">v5.0 · REBUILD</div>
    </div>

    <!-- ACTIVATION SCREEN -->
    <div class="activation-screen" id="activationScreen">
        <div class="activation-title">ANÚBIS</div>
        <button class="activation-button" id="activateBtn">► ATIVAR SISTEMA</button>
        <div class="activation-text">CLIQUE PARA INICIAR</div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container" id="appContainer">
        <!-- TOP: API KEY + STATUS -->
        <div class="app-top">
            <div class="app-header">
                <div class="app-name">ANÚBIS</div>
                <input type="password" class="api-key-input" id="apiKeyInput" placeholder="Cole sua API key do Anthropic...">
            </div>
            <div class="status-line user" id="userLine">Você: [aguardando]</div>
            <div class="status-line assistant" id="assistantLine">Anúbis: [inicializando...]</div>
        </div>

        <!-- CENTER: ORB + CONVERSATION -->
        <div class="app-center">
            <div class="orb-container" id="orbContainer">
                <div class="orb" id="orb"></div>
                <div class="orb-ring"></div>
            </div>
            <div class="conversation-area" id="conversationArea">
                <div class="conversation-line assistant-line">Bem-vindo, Senhor Sandro. Estou à sua disposição.</div>
            </div>
        </div>

        <!-- INPUT SECTION -->
        <div class="app-input-section">
            <div class="input-wrapper">
                <input type="text" class="text-input" id="textInput" placeholder="ou digite e tecle Enter...">
                <div class="control-buttons">
                    <button class="btn-control" id="micBtn" title="Ativar Microfone">🎙️</button>
                    <button class="btn-control" id="stopBtn" title="Interromper">⏹️</button>
                </div>
            </div>
        </div>

        <!-- SECOND BRAIN -->
        <div class="second-brain-container">
            <div class="brain-header">
                <div>
                    <div class="brain-title">🧠 <strong>SECOND BRAIN</strong></div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="brain-stats" id="brainStats">0 notas · 0 áreas</div>
                    <div class="brain-controls">
                        <button class="btn-brain" id="addNoteBtn">+</button>
                        <button class="btn-brain" id="refreshGraphBtn">⟳</button>
                    </div>
                </div>
            </div>
            <div class="graph-container" id="graphContainer"></div>
        </div>
    </div>

    <!-- MODAL — EDITOR DE NOTA -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Editar Nota</div>
            <form id="noteForm">
                <div class="form-group">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-input" id="noteTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Área</label>
                    <select class="form-select" id="noteArea" required>
                        <option value="">Selecione...</option>
                        <option value="meta">Você</option>
                        <option value="metas">Metas</option>
                        <option value="trabalho">Carreira</option>
                        <option value="projetos">Projetos</option>
                        <option value="financas">Finanças</option>
                        <option value="aprendizado">Aprendizado</option>
                        <option value="saude">Saúde</option>
                        <option value="relacoes">Relações</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Conteúdo</label>
                    <textarea class="form-textarea" id="noteBody" required></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-modal secondary" id="btnCancel">Cancelar</button>
                    <button type="button" class="btn-modal danger" id="btnDelete" style="display: none;">Deletar</button>
                    <button type="submit" class="btn-modal primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════════════════ */
        /* CONFIG E STATE */
        /* ═══════════════════════════════════════════════════════════════════════ */

        const CONFIG = {
            name: "Anúbis",
            address: "Senhor Sandro",
            themeColor: "dourado",
            persona: "formal britânico",
            wakeWord: "ei anúbis",
            voiceGender: "male",
            model: "claude-sonnet-5"
        };

        const AREA = {
            meta: { label: "Você", color: "#8a90a6" },
            metas: { label: "Metas", color: "#fbbf24" },
            trabalho: { label: "Carreira", color: "#ff5547" },
            projetos: { label: "Projetos", color: "#8b7cff" },
            financas: { label: "Finanças", color: "#f7931a" },
            aprendizado: { label: "Aprendizado", color: "#2dd4ff" },
            saude: { label: "Saúde", color: "#10b981" },

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* SPEECH RECOGNITION — WEB SPEECH API */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.error("Speech Recognition não suportado neste navegador.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                updateOrbState('listening');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                const cleanTranscript = transcript.toLowerCase().trim();

                if (needsWakeWord) {
                    if (cleanTranscript.includes('ei anúbis')) {
                        needsWakeWord = false;
                        // Captura o que vem DEPOIS da wake word
                        const afterWake = cleanTranscript.split('ei anúbis')[1]?.trim() || '';
                        if (afterWake) {
                            handleUserInput(afterWake);
                        }
                    }
                } else {
                    handleUserInput(cleanTranscript);
                    needsWakeWord = true;
                }
            };

            recognition.onerror = (event) => {
                console.error("Erro no reconhecimento:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Permissão de microfone negada. Você pode usar o campo de texto para interagir.");
                }
            };

            recognition.onend = () => {
                isListening = false;
                updateOrbState('idle');
                // Reinicia se não estiver ocupado
                if (!isBusy) {
                    try {
                        recognition.start();
                    } catch (e) {
                        // já iniciado
                    }
                }
            };
        }

        function startListening() {
            if (!recognition) return;
            try {
                recognition.start();
            } catch (e) {
                // já iniciado
            }
        }

        function stopListening() {
            if (!recognition) return;
            try {
                recognition.stop();
            } catch (e) {
                // já parado
            }
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* TEXT-TO-SPEECH */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function speak(text) {
            return new Promise((resolve) => {
                if (!synthesis) {
                    console.error("Speech Synthesis não disponível");
                    resolve();
                    return;
                }

                // Para qualquer fala anterior
                synthesis.cancel();

                // Aguarda vozes carregarem
                if (synthesis.getVoices().length === 0) {
                    synthesis.onvoiceschanged = () => doSpeak(text, resolve);
                } else {
                    doSpeak(text, resolve);
                }
            });
        }

        function doSpeak(text, resolve) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            
            const voices = synthesis.getVoices();
            const maleVoice = voices.find(v => v.lang === 'pt-BR' && v.name.includes('male')) || 
                             voices.find(v => v.lang.startsWith('pt')) ||
                             voices[0];
            
            if (maleVoice) utterance.voice = maleVoice;
            utterance.rate = 1;
            utterance.pitch = 0.9;

            isBusy = true;
            stopListening();
            updateOrbState('thinking');

            utterance.onend = () => {
                isBusy = false;
                needsWakeWord = true;
                updateOrbState('idle');
                startListening();
                resolve();
            };

            utterance.onerror = () => {
                isBusy = false;
                updateOrbState('idle');
                startListening();
                resolve();
            };

            synthesis.speak(utterance);
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* ORB STATE */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function updateOrbState(state) {
            const orb = document.getElementById('orb');
            orb.classList.remove('listening', 'thinking');
            if (state === 'listening') orb.classList.add('listening');
            else if (state === 'thinking') orb.classList.add('thinking');
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* INPUT HANDLING */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function setupEventListeners() {
            document.getElementById('textInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const text = document.getElementById('textInput').value.trim();
                    if (text) {
                        handleUserInput(text);
                        document.getElementById('textInput').value = '';
                    }
                }
            });

            document.getElementById('micBtn').addEventListener('click', () => {
                if (isBusy) return;
                if (isListening) {
                    stopListening();
                    document.getElementById('micBtn').classList.remove('active');
                } else {
                    startListening();
                    document.getElementById('micBtn').classList.add('active');
                }
            });

            document.getElementById('stopBtn').addEventListener('click', () => {
                synthesis.cancel();
                isBusy = false;
                updateOrbState('idle');
                startListening();
            });

            document.getElementById('orbContainer').addEventListener('click', () => {
                if (!isBusy) {
                    if (isListening) {
                        stopListening();
                        document.getElementById('micBtn').classList.remove('active');
                    } else {
                        startListening();
                        document.getElementById('micBtn').classList.add('active');
                    }
                }
            });

            document.getElementById('addNoteBtn').addEventListener('click', () => {
                currentEditId = null;
                openNoteEditor();
            });

            document.getElementById('refreshGraphBtn').addEventListener('click', () => {
                renderGraph();
            });

            document.getElementById('apiKeyInput').addEventListener('change', (e) => {
                localStorage.setItem('anthropic_key', e.target.value);
            });

            // Modal
            document.getElementById('btnCancel').addEventListener('click', closeModal);
            document.getElementById('noteForm').addEventListener('submit', handleNoteSave);
            document.getElementById('btnDelete').addEventListener('click', handleNoteDelete);

            const apiKey = localStorage.getItem('anthropic_key') || '';
            document.getElementById('apiKeyInput').value = apiKey;
        }

        function handleUserInput(text) {
            if (isBusy) return;

            isBusy = true;
            updateOrbState('thinking');
            stopListening();

            // Mostra no histórico
            updateUserLine(text);
            sessionHistory.push({ role: 'user', content: text });

            // Chama Claude
            callClaude(text).then((response) => {
                updateAssistantLine(response);
                sessionHistory.push({ role: 'assistant', content: response });

                // Processa [[SAVE:...]]
                const saveMatch = response.match(/\[\[SAVE:([a-z_]+)\|([^|]+)\|([\s\S]+?)\]\]/);
                if (saveMatch) {
                    const [, area, title, body] = saveMatch;
                    const cleanBody = body.trim();
                    saveOrUpdateNote(area, title, cleanBody);

                    // Remove da resposta antes de falar
                    const cleanResponse = response.replace(/\[\[SAVE:([a-z_]+)\|([^|]+)\|([\s\S]+?)\]\]/, '').trim();
                    speak(cleanResponse);
                } else {
                    speak(response);
                }
            }).catch((error) => {
                const errorMsg = `Erro: ${error.message}`;
                updateAssistantLine(errorMsg);
                speak(errorMsg);
            });
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* API — CLAUDE */
        /* ═══════════════════════════════════════════════════════════════════════ */

        async function callClaude(userMessage) {
            const apiKey = localStorage.getItem('anthropic_key');
            if (!apiKey) {
                throw new Error("Cole sua API key do Anthropic no campo de entrada.");
            }

            const systemPrompt = buildSystemPrompt();

            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                    "x-api-key": apiKey,
                    "anthropic-version": "2023-06-01",
                    "anthropic-dangerous-direct-browser-access": "true",
                    "content-type": "application/json"
                },
                body: JSON.stringify({
                    model: CONFIG.model,
                    max_tokens: 400,
                    system: systemPrompt,
                    messages: sessionHistory
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`Erro na API: ${errorData.error?.message || 'Desconhecido'}`);
            }

            const data = await response.json();
            if (!data.content || !data.content[0]) {
                throw new Error("Resposta vazia da API");
            }

            return data.content[0].text || "Desculpe, não consegui gerar uma resposta.";
        }

        function buildSystemPrompt() {
            let braonText = "";
            Object.keys(AREA).forEach((areaKey) => {
                const notesInArea = NOTES.filter(n => n.area === areaKey);
                if (notesInArea.length > 0) {
                    braonText += `\n## ${AREA[areaKey].label}\n`;
                    notesInArea.forEach((note) => {
                        braonText += `- **${note.title}**: ${note.body}\n`;
                    });
                }
            });

            return `Você é ${CONFIG.name}, um assistente pessoal formal, elegante e britânico. Você se dirige a ${CONFIG.address} com respeito e sofisticação.

Regras de resposta:
- Respostas CURTAS: máximo 2-4 frases, diretas, para serem faladas em voz alta.
- Português do Brasil.
- Sem markdown, sem emojis, sem listas — apenas prosa falada.
- Se o usuário revelar algo novo e duradouro sobre sua vida, termina a resposta com: [[SAVE:area|titulo|conteúdo]] (area ∈ metas, trabalho, projetos, financas, aprendizado, saude, relacoes, meta). Se existir nota com esse título, atualiza; senão cria nova.

SECOND BRAIN — Contexto de vida do ${CONFIG.address}:
${braonText}

Responda sempre considerando esse contexto. Seja assertivo, crítico construtivo, e aja como um conselheiro estratégico.`;
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* SECOND BRAIN — NOTAS */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function loadNotesFromStorage() {
            const stored = localStorage.getItem('jarvis_notes');
            if (stored) {
                NOTES = JSON.parse(stored);
            }
        }

        function saveNotesToStorage() {
            localStorage.setItem('jarvis_notes', JSON.stringify(NOTES));
        }

        function saveOrUpdateNote(area, title, body) {
            const existing = NOTES.find(n => n.title === title && n.area === area);
            if (existing) {
                existing.body = body;
            } else {
                const newId = String(Math.max(...NOTES.map(n => parseInt(n.id) || 0)) + 1);
                NOTES.push({ id: newId, area, title, body });
            }
            saveNotesToStorage();
            renderGraph();
            flashNode(title);
        }

        function flashNode(noteTitle) {
            const note = NOTES.find(n => n.title === noteTitle);
            if (!note) return;
            // Simples: re-renderiza com uma animação (feita via renderGraph)
            setTimeout(renderGraph, 100);
        }

        function openNoteEditor(noteId = null) {
            if (noteId) {
                const note = NOTES.find(n => n.id === noteId);
                if (note) {
                    document.getElementById('modalTitle').textContent = 'Editar Nota';
                    document.getElementById('noteTitle').value = note.title;
                    document.getElementById('noteArea').value = note.area;
                    document.getElementById('noteBody').value = note.body;
                    document.getElementById('btnDelete').style.display = 'block';
                    currentEditId = noteId;
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Nova Nota';
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteArea').value = '';
                document.getElementById('noteBody').value = '';
                document.getElementById('btnDelete').style.display = 'none';
                currentEditId = null;
            }

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function handleNoteSave(e) {
            e.preventDefault();
            const title = document.getElementById('noteTitle').value.trim();
            const area = document.getElementById('noteArea').value;
            const body = document.getElementById('noteBody').value.trim();

            if (!title || !area || !body) {
                alert("Preencha todos os campos.");
                return;
            }

            if (currentEditId) {
                const note = NOTES.find(n => n.id === currentEditId);
                if (note) {
                    note.title = title;
                    note.area = area;
                    note.body = body;
                }
            } else {
                const newId = String(Math.max(...NOTES.map(n => parseInt(n.id) || 0)) + 1);
                NOTES.push({ id: newId, area, title, body });
            }

            saveNotesToStorage();
            renderGraph();
            closeModal();
        }

        function handleNoteDelete() {
            if (!currentEditId || !confirm("Deletar esta nota?")) return;
            NOTES = NOTES.filter(n => n.id !== currentEditId);
            saveNotesToStorage();
            renderGraph();
            closeModal();
        }

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* GRAFO NEURAL — SVG */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function renderGraph() {
            const container = document.getElementById('graphContainer');
            const width = 1000, height = 540;
            const cx = width / 2, cy = height / 2.2;
            const radius = 140;

            // Conta por área
            const areaCount = new Set(NOTES.map(n => n.area)).size;
            document.getElementById('brainStats').textContent = `${NOTES.length} notas · ${areaCount} áreas`;

            // SVG inline
            let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#9f7aea;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#2dd4ff;stop-opacity:0.4" />
                    </linearGradient>
                    <linearGradient id="coreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                    </linearGradient>
                    <style>
                        @keyframes breath { 0%, 100% { r: 18px; opacity: 0.4; } 50% { r: 24px; opacity: 0.1; } }
                        @keyframes corePulse { 0%, 100% { r: 16px; } 50% { r: 20px; } }
                        @keyframes dash { to { stroke-dashoffset: -1000; } }
                        .core-pulse { animation: corePulse 2s ease-in-out infinite; }
                        .node-ring { animation: breath 2.5s ease-in-out infinite; }
                        .edge-dash { animation: dash 20s linear infinite; }
                    </style>
                </defs>`;

            // Arestas (curvas)
            svg += '<g id="edges" opacity="0.7">';
            REL.forEach((edge, idx) => {
                const [idA, idB] = edge;
                const noteA = NOTES.find(n => n.id === idA);
                const noteB = NOTES.find(n => n.id === idB);
                if (noteA && noteB) {
                    const idxA = NOTES.indexOf(noteA);
                    const idxB = NOTES.indexOf(noteB);
                    const angle1 = (idxA / NOTES.length) * Math.PI * 2 - Math.PI / 2;
                    const angle2 = (idxB / NOTES.length) * Math.PI * 2 - Math.PI / 2;
                    const x1 = cx + Math.cos(angle1) * radius;
                    const y1 = cy + Math.sin(angle1) * radius;
                    const x2 = cx + Math.cos(angle2) * radius;
                    const y2 = cy + Math.sin(angle2) * radius;

                    // Ponto de controle para curvatura
                    const ctrlX = cx + (Math.cos(angle1) + Math.cos(angle2)) / 2 * (radius * 0.35);
                    const ctrlY = cy + (Math.sin(angle1) + Math.sin(angle2)) / 2 * (radius * 0.35);

                    svg += `<path d="M ${x1} ${y1} Q ${ctrlX} ${ctrlY} ${x2} ${y2}" stroke="url(#edgeGradient)" stroke-width="1.5" fill="none" class="edge-dash" style="stroke-dasharray: 1000;"/>`;
                }
            });
            svg += '</g>';

            // Raios do núcleo
            svg += '<g id="rays" opacity="0.4">';
            NOTES.forEach((note, idx) => {
                const angle = (idx / NOTES.length) * Math.PI * 2 - Math.PI / 2;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;
                const color = AREA[note.area]?.color || '#8a90a6';
                svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="1" opacity="0.3"/>`;
            });
            svg += '</g>';

            // Núcleo (core)
            svg += `<circle cx="${cx}" cy="${cy}" r="16" fill="url(#coreGradient)" filter="url(#glow)" class="core-pulse"/>`;
            svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#fff" font-weight="bold">🧠</text>`;

            // Nós
            svg += '<g id="nodes">';
            NOTES.forEach((note, idx) => {
                const angle = (idx / NOTES.length) * Math.PI * 2 - Math.PI / 2;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;
                const color = AREA[note.area]?.color || '#8a90a6';
                const connections = REL.filter(e => e.includes(note.id)).length;
                const size = 8 + connections * 2;

                svg += `<g class="node" data-id="${note.id}" style="cursor: pointer;" onclick="window.openNoteFromGraph('${note.id}')">`;
                svg += `<circle cx="${x}" cy="${y}" r="${size}" fill="${color}" opacity="0.8" filter="url(#glow)"/>`;
                svg += `<circle cx="${x}" cy="${y}" r="${size + 8}" fill="none" stroke="${color}" stroke-width="1.5" class="node-ring"/>`;
                svg += `<text x="${x}" y="${y + size + 18}" text-anchor="middle" font-size="11" fill="#f5f5f5" pointer-events="none">${note.title.substring(0, 12)}</text>`;
                svg += `</g>`;
            });
            svg += '</g>';

            // Pulsos de sinapse (pontos brilhantes)
            const pulseCount = 12;
            svg += '<g id="pulses" opacity="0.8">';
            for (let i = 0; i < pulseCount; i++) {
                const edgeIdx = i % REL.length;
                if (REL[edgeIdx]) {
                    const [idA, idB] = REL[edgeIdx];
                    const noteA = NOTES.find(n => n.id === idA);
                    const noteB = NOTES.find(n => n.id === idB);
                    if (noteA && noteB) {
                        const idxA = NOTES.indexOf(noteA);
                        const idxB = NOTES.indexOf(noteB);
                        const angle1 = (idxA / NOTES.length) * Math.PI * 2 - Math.PI / 2;
                        const angle2 = (idxB / NOTES.length) * Math.PI * 2 - Math.PI / 2;
                        const x1 = cx + Math.cos(angle1) * radius;
                        const y1 = cy + Math.sin(angle1) * radius;
                        const x2 = cx + Math.cos(angle2) * radius;
                        const y2 = cy + Math.sin(angle2) * radius;
                        const ctrlX = cx + (Math.cos(angle1) + Math.cos(angle2)) / 2 * (radius * 0.35);
                        const ctrlY = cy + (Math.sin(angle1) + Math.sin(angle2)) / 2 * (radius * 0.35);

                        const t = (i * 0.08) % 1;
                        const px = Math.pow(1 - t, 2) * x1 + 2 * (1 - t) * t * ctrlX + Math.pow(t, 2) * x2;
                        const py = Math.pow(1 - t, 2) * y1 + 2 * (1 - t) * t * ctrlY + Math.pow(t, 2) * y2;

                        svg += `<circle cx="${px}" cy="${py}" r="2.5" fill="#fff" opacity="${0.5 + Math.sin(i) * 0.3}"/>`;
                    }
                }
            }
            svg += '</g>';

            // Legenda
            const legendX = 20, legendY = height - 50;
            svg += '<g id="legend" font-size="11">';
            let legendOffset = 0;
            Object.keys(AREA).forEach((areaKey) => {
                const hasNotes = NOTES.some(n => n.area === areaKey);
                if (hasNotes) {
                    const color = AREA[areaKey].color;
                    svg += `<rect x="${legendX + legendOffset}" y="${legendY}" width="12" height="12" fill="${color}" opacity="0.8"/>`;
                    svg += `<text x="${legendX + legendOffset + 16}" y="${legendY + 10}" fill="#f5f5f5">${AREA[areaKey].label}</text>`;
                    legendOffset += 140;
                }
            });
            svg += `<text x="${width - 220}" y="${legendY + 10}" fill="#10b981" font-size="10">✓ contexto injetado em todos os comandos</text>`;
            svg += '</g>';

            svg += '</svg>';

            // Injeta via innerHTML (CRÍTICO para namespace SVG)
            container.innerHTML = svg;
        }

        window.openNoteFromGraph = (noteId) => {
            openNoteEditor(noteId);
        };

        /* ═══════════════════════════════════════════════════════════════════════ */
        /* UI — STATUS LINES */
        /* ═══════════════════════════════════════════════════════════════════════ */

        function updateUserLine(text) {
            const truncated = text.length > 60 ? text.substring(0, 60) + "..." : text;
            document.getElementById('userLine').textContent = `Você: ${truncated}`;
        }

        function updateAssistantLine(text) {
            const truncated = text.length > 60 ? text.substring(0, 60) + "..." : text;
            document.getElementById('assistantLine').textContent = `Anúbis: ${truncated}`;
        }
    </script>

</body>
</html>
